# docker-compose.yml — MeshBridge service definition
# Uses the project Dockerfile to build the bridge image,
# connects to a dedicated Meshtastic network for inter-service communication,
# and configures env_file, log rotation, and graceful shutdown.

services:
  # ── MeshBridge ─────────────────────────────────────────────────────
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: meshbridge:latest
    container_name: meshbridge
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "5000:5000"           # Flask webapp
    volumes:
      - bridge-data:/app/data    # Persistent data directory
    networks:
      - meshtastic-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Companion services (uncomment as needed) ──────────────────────

  # mosquitto:
  #   image: eclipse-mosquitto:2
  #   container_name: mosquitto
  #   restart: unless-stopped
  #   ports:
  #     - "1883:1883"
