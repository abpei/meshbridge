  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

# ── Networks ──────────────────────────────────────────────────────────
networks:
  meshtastic-net:
    driver: bridge
    name: meshtastic-net

# ── Volumes ───────────────────────────────────────────────────────────
volumes:
  bridge-data:
